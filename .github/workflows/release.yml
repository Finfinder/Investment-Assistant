name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  version-consistency:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-version-consistency.yml
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-version: ${{ github.ref_name }}
    secrets: inherit

  next-version-request:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-next-version-request.yml
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.ref }}
      expected-release-version: ${{ github.ref_name }}
    secrets: inherit

  sonarcloud:
    needs: [version-consistency]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-sonarcloud.yml
    secrets: inherit

  frontend:
    needs: [version-consistency, next-version-request]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      working-directory: "frontend"
    secrets: inherit

  mutation-testing:
    needs: [version-consistency]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-mutation-testing.yml

  frontend-mutation-testing:
    needs: [version-consistency]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-frontend-mutation-testing.yml

  backend:
    needs: [version-consistency]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend.yml
    with:
      working-directory: "backend"

  release:
    needs: [version-consistency, next-version-request, frontend, mutation-testing, frontend-mutation-testing, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Prepare release metadata
        id: prepare
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          tag_name = os.environ['TAG_NAME']
          version = tag_name.removeprefix('v')
          changelog_path = Path('CHANGELOG.md')
          notes_path = Path(os.environ['RUNNER_TEMP']) / 'release_notes.md'

          lines = changelog_path.read_text(encoding='utf-8').splitlines()
          start = None
          end = None

          for index, line in enumerate(lines):
              if line.startswith('## ['):
                  if line.startswith(f'## [{version}]'):
                      start = index + 1
                  elif start is not None:
                      end = index
                      break

          if start is None:
              notes = f'Release {version}\n\nNo dedicated entry found in CHANGELOG.md for this version.\n'
          else:
              selected_lines = lines[start:end]
              while selected_lines and not selected_lines[0].strip():
                  selected_lines.pop(0)
              while selected_lines and not selected_lines[-1].strip():
                  selected_lines.pop()

              notes = '\n'.join(selected_lines).strip()
              if not notes:
                  notes = f'Release {version}\n\nNo detailed notes were recorded in CHANGELOG.md for this version.\n'
              else:
                  notes += '\n'

          notes_path.write_text(notes, encoding='utf-8')

          github_output = Path(os.environ['GITHUB_OUTPUT'])
          with github_output.open('a', encoding='utf-8') as handle:
              handle.write(f'tag_name={tag_name}\n')
              handle.write(f'version={version}\n')
              handle.write(f'release_title=Investment Assistant {version}\n')
              handle.write(f'notes_path={notes_path.as_posix()}\n')
          PY

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          install: true

      - name: Build and push release images
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_LIST_PATH: ${{ runner.temp }}/release-images.md
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_name="$(printf '%s' "${REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          stable_release=true

          if [[ "$VERSION" == *-* ]]; then
            stable_release=false
          fi

          publish_image() {
            local suffix="$1"
            local title="$2"
            local description="$3"
            local context_path="$4"
            shift 4

            local image_ref="ghcr.io/${owner}/${repo_name}-${suffix}"
            local semver_tag="${image_ref}:${VERSION}"
            local sha_tag="${image_ref}:sha-${COMMIT_SHA}"

            local tags_args=(
              -t "$semver_tag"
              -t "$sha_tag"
            )

            if [[ "$stable_release" == true ]]; then
              tags_args+=( -t "${image_ref}:latest" )
            fi

            docker buildx build \
              --cache-from "type=gha" \
              --cache-to "type=gha,mode=max" \
              --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
              --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --label "org.opencontainers.image.title=${title}" \
              --label "org.opencontainers.image.description=${description}" \
              "${tags_args[@]}" \
              "$@" \
              --push \
              "$context_path"

            {
              echo "- ${semver_tag}"
              echo "- ${sha_tag}"
            } >> "$IMAGE_LIST_PATH"

            if [[ "$stable_release" == true ]]; then
              echo "- ${image_ref}:latest" >> "$IMAGE_LIST_PATH"
            fi
          }

          : > "$IMAGE_LIST_PATH"

          # Validate the backend Python version source before build (defense-in-depth, IA-167)
          python_version="$(head -1 backend/.python-version 2>/dev/null | tr -d '\r\n ')"
          if [[ -z "$python_version" ]] || ! grep -Eq '^v?[0-9]+(\.[0-9]+){0,2}$' <<< "$python_version"; then
            echo "::error::backend/.python-version must contain a Python version (e.g. 3.12, 3.12.0, v3.12.0), got: '${python_version}'" >&2
            exit 1
          fi
          python_version="${python_version#v}"  # strip optional leading 'v'
          python_image_version="${python_version}-slim"  # backend image uses the -slim variant

          publish_image \
            backend \
            "Investment Assistant backend" \
            "Backend API image for Investment Assistant." \
            ./backend \
            --build-arg PYTHON_VERSION="$python_image_version"

          # Validate the frontend Node version source before build (defense-in-depth, IA-152 F-1)
          node_version="$(head -1 frontend/.nvmrc 2>/dev/null | tr -d '\r\n ')"
          if [[ -z "$node_version" ]] || ! grep -Eq '^v?[0-9]+(\.[0-9]+){0,2}$' <<< "$node_version"; then
            echo "::error::frontend/.nvmrc must contain a Node version (e.g. 20, 20.16, 20.16.0, v20.16.0), got: '${node_version}'" >&2
            exit 1
          fi
          node_version="${node_version#v}"  # strip optional leading 'v'

          publish_image \
            frontend \
            "Investment Assistant frontend" \
            "Next.js frontend image for Investment Assistant." \
            ./frontend \
            --build-arg NODE_VERSION="$node_version" \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            --build-arg NEXT_PUBLIC_WS_URL=/api/v1

          # Validate the nginx version source before build (defense-in-depth, IA-167)
          nginx_version="$(head -1 nginx/.nginxrc 2>/dev/null | tr -d '\r\n ')"
          if [[ -z "$nginx_version" ]]; then
            echo "::error::nginx/.nginxrc must contain an nginx version (e.g. 1.27-alpine), got: '${nginx_version}'" >&2
            exit 1
          fi

          publish_image \
            nginx \
            "Investment Assistant nginx" \
            "Reverse proxy image for Investment Assistant." \
            ./nginx \
            --build-arg NGINX_VERSION="$nginx_version"

      - name: Prepare GitHub release body
        env:
          NOTES_PATH: ${{ steps.prepare.outputs.notes_path }}
          IMAGE_LIST_PATH: ${{ runner.temp }}/release-images.md
          RELEASE_BODY_PATH: ${{ runner.temp }}/release_body.md
        run: |
          cp "$NOTES_PATH" "$RELEASE_BODY_PATH"
          {
            echo
            echo "## Container images"
            cat "$IMAGE_LIST_PATH"
          } >> "$RELEASE_BODY_PATH"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.prepare.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.release_title }}
          RELEASE_BODY_PATH: ${{ runner.temp }}/release_body.md
        run: |
          set -euo pipefail

          release_view_stderr="${{ runner.temp }}/release_view.stderr"

          if gh release view "$TAG_NAME" >/dev/null 2>"$release_view_stderr"; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_PATH"
          else
            view_status=$?

            if grep -qi "release not found" "$release_view_stderr"; then
              gh release create "$TAG_NAME" --verify-tag --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_PATH"
            else
              cat "$release_view_stderr" >&2
              exit "$view_status"
            fi
          fi
