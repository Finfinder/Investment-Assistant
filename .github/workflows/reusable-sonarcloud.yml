name: Reusable SonarCloud Scan

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: Git fetch-depth for checkout (0 = full history for SonarCloud blame).
        required: false
        default: 0
        type: number
    secrets:
      SONAR_TOKEN:
        description: SonarCloud authentication token for code analysis.
        required: true

permissions: {}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=app --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup

      - name: Generate frontend coverage (LCOV)
        working-directory: frontend
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
