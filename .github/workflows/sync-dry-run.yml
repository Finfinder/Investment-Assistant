name: Sync dry-run

on:
  push:
    branches: [ main, master ]
    tags: []
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  sync-dry-run:
    name: Sync dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate UTF-8 and uniqueness
        shell: pwsh
        run: |
          $warnings = @()
          $files = @('.github/gh-sync.json', '.github/issue-seed.json')
          foreach ($f in $files) {
            if (Test-Path $f) {
              try {
                $raw = Get-Content -Raw -Encoding UTF8 $f -ErrorAction Stop
              } catch {
                $errMsg = $_.Exception.Message
                Write-Output "$f is not valid UTF-8 or cannot be read: $errMsg"
                $warnings += "$f encoding"
                continue
              }
              try {
                $json = $raw | ConvertFrom-Json -ErrorAction Stop
                $ids = @()
                if ($json -is [System.Collections.IEnumerable]) {
                  foreach ($item in $json) { if ($null -ne $item.sourceId) { $ids += $item.sourceId } }
                } else { if ($null -ne $json.sourceId) { $ids += $json.sourceId } }
                $dups = $ids | Group-Object | Where-Object { $_.Count -gt 1 }
                if ($dups) { Write-Warning "$f zawiera duplikaty sourceId: $($dups | ForEach-Object { $_.Name } -join ', ')"; $warnings += "$f duplicates" }
              } catch {
                $errMsg = $_.Exception.Message
                Write-Output "Cannot parse JSON from $f: $errMsg"
                $warnings += "$f parse"
              }
            } else {
              Write-Output "File $f does not exist - continuing (warning)."
            }
          }
          if ($warnings.Count -gt 0) { Write-Output "WARNINGS: $($warnings -join '; ')" }

      - name: Run dry-run scripts (if present)
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue sync-dry-run.log
          $scripts = @('./scripts/sync-github-meta.ps1', './scripts/seed-github-issues.ps1')
          foreach ($s in $scripts) {
            if (Test-Path $s) {
              Write-Output "Running $s with -DryRun parameter (if available), output to sync-dry-run.log"
              try {
                & $s -DryRun *>&1 | Tee-Object -FilePath sync-dry-run.log -Append
              } catch {
                Write-Warning "-DryRun execution failed, trying without parameters"
                try { & $s *>&1 | Tee-Object -FilePath sync-dry-run.log -Append } catch { $errMsg = $_.Exception.Message; Write-Output "Error running $s: $errMsg"; "ERROR running $s`n$errMsg" | Out-File -FilePath sync-dry-run.log -Append }
              }
            } else { Write-Output "Script $s does not exist - skipping." | Tee-Object -FilePath sync-dry-run.log -Append }
          }

      - name: Upload dry-run log
        uses: actions/upload-artifact@v4
        with:
          name: sync-dry-run-log
          path: sync-dry-run.log

      - name: Analyze dry-run log for potential changes
        shell: pwsh
        run: |
          if (Test-Path sync-dry-run.log) {
            $log = Get-Content sync-dry-run.log -Raw
            if ($log -match '(change|apply|will be created|will be modified|To be applied|Changes:|CHANGE)') {
              Write-Output "POTENTIAL CHANGES IN LOG"
              Write-Output "Found phrases suggesting changes."
            } else {
              Write-Output "No obvious phrases suggesting changes found."
            }
          } else { Write-Output "No sync-dry-run.log file for analysis." }
