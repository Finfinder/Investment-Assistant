name: CI

on:
  push:
    branches:
      - 'main'
      - 'release/**'
      - 'v*.*.*'
      - '*.*.*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  version-consistency:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/reusable-version-consistency.yml
    with:
      source-repository: ${{ github.repository }}
      repository-ref: ${{ github.sha }}
    secrets: inherit

  lint:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Ruff check
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

  type-check:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Mypy
        run: mypy app/

  test:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=app --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Check coverage threshold
        run: coverage report --fail-under=80

  security:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]" pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --skip-editable --ignore-vuln CVE-2026-4539

  frontend-lint:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup

      - name: Lint
        run: npm run lint

  frontend-test:
    needs: [version-consistency]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup

      - name: Run unit tests (Vitest)
        run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [version-consistency, frontend-lint]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/frontend-setup
        with:
          cache-next-build: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (including accessibility)
        run: npx playwright test

      - name: Save Next.js build cache
        uses: ./.github/actions/frontend-build-cache-save
        with:
          cache-hit: ${{ steps.frontend-setup.outputs.cache-hit }}

  sonarcloud:
    needs: [test, frontend-test]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-sonarcloud.yml
    secrets: inherit
