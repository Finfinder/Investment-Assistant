name: Reusable Mutation Testing

on:
  workflow_call:
    inputs:
      min-score:
        description: Optional override of the minimum acceptable mutation score in percent, enforced independently for each module in the run_mutmut.py scope list. When omitted, the value is read from mutation-threshold.json at the repository root (shared with the frontend Stryker gate).
        required: false
        type: number
      python-version-file:
        description: Path to the file containing the Python version for the backend jobs (single source of truth, e.g. backend/.python-version).
        required: false
        default: "backend/.python-version"
        type: string

permissions: {}

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ${{ inputs.python-version-file }}

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install ".[dev]"

      - name: Resolve mutation score threshold
        id: threshold
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [ -n "${{ inputs.min-score }}" ]; then
            echo "min-score=${{ inputs.min-score }}" >> "$GITHUB_OUTPUT"
          else
            value=$(python -c "import json,sys; print(json.load(open('mutation-threshold.json'))['mutationScoreThreshold'])")
            echo "min-score=${value}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation testing with mutmut
        run: python scripts/run_mutmut.py --min-score ${{ steps.threshold.outputs.min-score }}
