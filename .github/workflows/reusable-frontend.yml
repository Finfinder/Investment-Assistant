name: Reusable Frontend

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the file containing the Node.js version for the frontend jobs (single source of truth, e.g. frontend/.nvmrc).
        required: false
        default: "frontend/.nvmrc"
        type: string
      working-directory:
        description: Working directory containing the frontend project (package-lock.json).
        required: false
        default: "frontend"
        type: string

permissions: {}

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lint
        run: npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run unit tests (Vitest)
        run: npm run test

  frontend-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate

  frontend-node-version-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify NODE_VERSION in Dockerfile matches .nvmrc
        shell: bash
        env:
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          DOCKERFILE_PATH: ${{ inputs.working-directory }}/Dockerfile
        run: |
          set -euo pipefail

          nvmrc_version="$(head -1 "$NODE_VERSION_FILE" 2>/dev/null | tr -d '\r\n ' | sed 's/^v//')"
          if [[ -z "$nvmrc_version" ]] || ! grep -Eq '^v?[0-9]+(\.[0-9]+){0,2}$' <<< "$nvmrc_version"; then
            echo "::error::${NODE_VERSION_FILE} must contain a Node version (e.g. 20, 20.16, 20.16.0, v20.16.0), got: '${nvmrc_version}'" >&2
            exit 1
          fi

          if [[ ! -f "$DOCKERFILE_PATH" ]]; then
            echo "::error::Dockerfile not found at ${DOCKERFILE_PATH}" >&2
            exit 1
          fi

          dockerfile_arg="$(grep -E '^ARG[[:space:]]+NODE_VERSION=' "$DOCKERFILE_PATH" | head -1 | sed -E 's/^ARG[[:space:]]+NODE_VERSION=//' | tr -d '\r\n ' | sed 's/^v//')"
          if [[ -z "$dockerfile_arg" ]]; then
            echo "::error::${DOCKERFILE_PATH} must define a default NODE_VERSION via 'ARG NODE_VERSION=...'" >&2
            exit 1
          fi

          if [[ "$nvmrc_version" != "$dockerfile_arg" ]]; then
            echo "::error::NODE_VERSION default in ${DOCKERFILE_PATH} (${dockerfile_arg}) does not match ${NODE_VERSION_FILE} (${nvmrc_version})" >&2
            exit 1
          fi

          echo "NODE_VERSION consistency verified: ${nvmrc_version} (${NODE_VERSION_FILE} == ${DOCKERFILE_PATH})"

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-security]
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}
          cache-next-build: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (including accessibility)
        run: npx playwright test

      - name: Save Next.js build cache
        uses: ./.github/actions/frontend-build-cache-save
        with:
          cache-hit: ${{ steps.frontend-setup.outputs.cache-hit }}
          working-directory: ${{ inputs.working-directory }}
