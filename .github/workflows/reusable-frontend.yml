name: Reusable Frontend

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Path to the file containing the Node.js version for the frontend jobs (single source of truth, e.g. frontend/.nvmrc).
        required: false
        default: "frontend/.nvmrc"
        type: string
      working-directory:
        description: Working directory containing the frontend project (package-lock.json).
        required: false
        default: "frontend"
        type: string

permissions: {}

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lint
        run: npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}

      - name: Run unit tests (Vitest)
        run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up frontend
        id: frontend-setup
        uses: ./.github/actions/frontend-setup
        with:
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}
          cache-next-build: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (including accessibility)
        run: npx playwright test

      - name: Save Next.js build cache
        uses: ./.github/actions/frontend-build-cache-save
        with:
          cache-hit: ${{ steps.frontend-setup.outputs.cache-hit }}
          working-directory: ${{ inputs.working-directory }}
