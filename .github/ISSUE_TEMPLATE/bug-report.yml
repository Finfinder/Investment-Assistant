name: Bug Report
description: Report a bug in Investment Assistant
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application Version
      description: Which version of Investment Assistant are you using?
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected Area
      description: Which part of the application is affected?
      options:
        - Backend API
        - Frontend UI
        - Docker/Infrastructure
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - macOS 14+
        - Ubuntu 22.04
        - Debian
        - Other
    validations:
      required: true

  - type: input
    id: os-other
    attributes:
      label: Other Operating System
      description: If you selected "Other" above, please specify.
      placeholder: "e.g. Fedora 40, Arch Linux"
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Which Python version are you using? (for backend issues)
      placeholder: "e.g. 3.12.7, 3.13.1"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Which Node.js version are you using? (for frontend issues)
      placeholder: "e.g. 20.x"
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using? (for frontend issues)
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Type
      options:
        - Docker
        - Local development
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > **⚠️ Security Warning:** Do NOT paste sensitive data such as API keys, passwords, or tokens in this issue. If you believe you have found a security vulnerability, please report it privately via [GitHub Security Advisories](https://github.com/Finfinder/Investment-Assistant/security/advisories/new).

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, configuration, etc.).
    validations:
      required: false
