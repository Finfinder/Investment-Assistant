# SonarCloud project configuration for Investment-Assistant
# Organization and project keys from SonarCloud onboarding
sonar.projectKey=Finfinder_Investment-Assistant
sonar.organization=finfinder

# Source code encoding
sonar.sourceEncoding=UTF-8

# Backend (Python) sources and tests
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Python specific
# sonar.language removed - SonarCloud auto-detects languages by file extension
sonar.python.version=3.12

# Coverage report paths
# Frontend LCOV not generated in this workflow - frontend coverage excluded via sonar.coverage.exclusions
sonar.python.coverage.reportPaths=backend/coverage.xml

# Test report paths (disabled - not generated by pytest)
# sonar.python.xunit.reportPath=backend/test-results.xml

# Exclusions
sonar.exclusions=backend/alembic/versions/**,frontend/node_modules/**,frontend/.next/**,backend/.venv/**,**/*.pyc
sonar.coverage.exclusions=backend/tests/**,frontend/**

# Test inclusions
sonar.test.inclusions=backend/tests/**/*.py

# Ignore patterns
sonar.scm.exclusions.disabled=true
